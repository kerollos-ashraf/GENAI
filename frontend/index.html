<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0F3B3A" />
    <script>
      // Apply the saved theme before first paint (no light flash in dark mode).
      try {
        const theme = localStorage.getItem("omnicare_theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <title>OmniCare Assistant</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230F3B3A'/%3E%3Cpath d='M12 4.5 6 6.8v4.6c0 3.6 2.6 6.5 6 7.4 3.4-.9 6-3.8 6-7.4V6.8L12 4.5Z' fill='none' stroke='white' stroke-width='1.4'/%3E%3Cpath d='m9.4 12 1.9 1.9 3.4-3.6' fill='none' stroke='%23F4C152' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Public+Sans:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
